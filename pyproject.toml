[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-vault"
version = "1.0.0"
description = "Multi-agent DID keystore, atomic nonce manager, and cryptographic audit pipeline for Technocore"
readme = "README.md"
authors = [{ name = "ght25" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=48.0.0",
]

[project.scripts]
technocore-vault = "technocore_vault.cli:main"
vault = "technocore_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
